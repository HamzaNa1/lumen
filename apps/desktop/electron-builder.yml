{
  "appId": "dev.lumen.desktop",
  "productName": "Lumen",
  "asar": true,
  "electronLanguages": ["en-US"],
  "files": ["out/**", "package.json"],
  "extraResources": [{ "from": "resources/native", "to": "resources/native" }],
  "directories": { "output": "release" },
  "mac": {
    "category": "public.app-category.video",
    "icon": "resources/icons/icon.icns",
    "extendInfo": {
      "NSLocalNetworkUsageDescription": "Lumen connects to media servers on your local network."
    },
    "target": [
      { "target": "dmg", "arch": "arm64" },
      { "target": "zip", "arch": "arm64" }
    ]
  },
  "win": {
    "icon": "resources/icons/icon.ico",
    "target": ["nsis", "portable"],
    "publish": [{ "provider": "github", "owner": "HamzaNa1", "repo": "lumen", "channel": "latest" }]
  },
  "nsis": {
    "artifactName": "Lumen-Setup-${version}-${arch}.${ext}"
  },
  "portable": {
    "artifactName": "Lumen-Portable-${version}-${arch}.${ext}"
  },
  "linux": {
    "icon": "resources/icons/icon.png",
    "target": ["AppImage", "deb"],
    "category": "AudioVideo",
    "maintainer": "Lumen <HamzaNa1@users.noreply.github.com>"
  }
}
