{
  "appId": "dev.lumen.desktop",
  "productName": "Lumen",
  "asar": true,
  "asarUnpack": ["resources/native/**"],
  "files": ["dist/**", "resources/**", "package.json"],
  "directories": { "output": "release" },
  "mac": { "category": "public.app-category.video", "target": ["dmg", "zip"] },
  "win": { "target": ["nsis", "portable"] },
  "linux": { "target": ["AppImage", "deb"], "category": "AudioVideo" },
  "publish": [{ "provider": "generic", "url": "https://updates.lumen.invalid" }]
}
