name: Windows native playback
description: Build and exercise the real Electron/MPV player, retaining native failure evidence.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/e2e-runtime
    - name: Check desktop types
      shell: pwsh
      run: |
        bun run --cwd apps/desktop typecheck
        if ($LASTEXITCODE -ne 0) { throw "Desktop typecheck failed" }
        bun run typecheck:tests
        if ($LASTEXITCODE -ne 0) { throw "E2E typecheck failed" }
    - uses: ./.github/actions/bundle-mpv
    - name: Real Electron lifecycle, playback and audio
      shell: pwsh
      run: bun scripts/test-e2e.ts source --project native --no-deps
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: windows-native-regression-${{ github.sha }}
        path: |
          test-results/
          playwright-report/
        if-no-files-found: error
        retention-days: 14
