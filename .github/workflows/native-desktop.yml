name: native-desktop
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: macOS lifecycle and MPV audio
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - name: Real Electron lifecycle, mixed playback and MPV audio
        run: bun scripts/test-e2e.ts source --project native --no-deps
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: macos-native-regression-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows Electron and MPV playback
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/windows-playback
