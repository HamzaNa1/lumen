name: compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  native-desktop:
    uses: ./.github/workflows/native-desktop.yml
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - run: xvfb-run -a bash scripts/with-window-manager.sh bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: compatibility-e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
