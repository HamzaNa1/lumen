name: compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  native-desktop:
    uses: ./.github/workflows/native-desktop.yml
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test tests/compatibility tests/server tests/web tests/desktop tests/shared
