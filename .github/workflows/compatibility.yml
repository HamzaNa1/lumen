name: compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  release-compatibility:
    uses: ./.github/workflows/release-compatibility.yml
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-latest]
    uses: ./.github/workflows/client-e2e.yml
    with:
      runner: ${{ matrix.runner }}
      project: native
  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-runtime
        with:
          browsers: chromium firefox webkit
      - run: bun scripts/test-e2e.ts source --project api --project tooling --project chromium --project firefox --project webkit
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: scheduled-portable
