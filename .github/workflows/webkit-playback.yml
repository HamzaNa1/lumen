name: WebKit playback verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/webkit-playback.yml
      - tests/fixtures/playback.webm
      - tests/browser/playback.ts
      - apps/web/src/HtmlMediaPlayer.ts
      - apps/server/src/**
      - apps/server/package.json
      - bun.lock
jobs:
  playback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        delivery: [source, server]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Repeat each affected scenario twenty times without retries
        env:
          DELIVERY: ${{ matrix.delivery }}
        run: |
          set -o pipefail
          mkdir -p proof
          uname -a > proof/environment.txt
          bun --version >> proof/environment.txt
          bun run playwright --version >> proof/environment.txt
          bun scripts/test-browser.ts "$DELIVERY" web-app.e2e.ts --project webkit --grep "supported media plays|each show and film|double-clicking|the player moves between" --repeat-each 20 --retries 0 --trace on 2>&1 | tee proof/repetitions.log
      - name: Preserve repetitions before running the broader browser suite
        if: ${{ !cancelled() }}
        run: |
          mkdir -p proof/repetitions
          mv test-results playwright-report proof/repetitions/
      - name: Run all browsers for this delivery
        if: ${{ !cancelled() }}
        env:
          DELIVERY: ${{ matrix.delivery }}
        run: |
          set -o pipefail
          bun scripts/test-browser.ts "$DELIVERY" --retries 0 2>&1 | tee proof/browser-suite.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: webkit-playback-${{ matrix.delivery }}
          path: |
            proof/
            test-results/
            playwright-report/
          retention-days: 14
