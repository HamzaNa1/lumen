name: WebKit playback verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/webkit-playback.yml
      - tests/fixtures/playback.webm
      - tests/browser/playback.ts
      - apps/web/src/HtmlMediaPlayer.ts
      - apps/server/src/http/**
      - apps/server/package.json
      - bun.lock
jobs:
  playback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        delivery: [source, server]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: Repeat each affected scenario twenty times without retries
        env:
          DELIVERY: ${{ matrix.delivery }}
        run: |
          set -o pipefail
          mkdir -p proof
          uname -a > proof/environment.txt
          bun --version >> proof/environment.txt
          bun run playwright --version >> proof/environment.txt
          # Each repetition seeds a fresh server, so saved progress never carries between them.
          failed=0
          for iteration in $(seq 1 20); do
            bun scripts/test-browser.ts "$DELIVERY" web-app.e2e.ts --project webkit \
              --grep "supported media plays|each show and film|double-clicking|the player moves between" \
              --retries 0 --trace on 2>&1 | tee "proof/repetition-$iteration.log" || failed=$((failed + 1))
            mkdir -p "proof/repetition-$iteration"
            mv test-results playwright-report "proof/repetition-$iteration/"
          done
          echo "$failed of 20 repetitions failed" | tee proof/repetitions-summary.txt
          test "$failed" -eq 0
      - name: Run all browsers for this delivery
        if: ${{ !cancelled() }}
        env:
          DELIVERY: ${{ matrix.delivery }}
        run: |
          set -o pipefail
          bun scripts/test-browser.ts "$DELIVERY" --retries 0 2>&1 | tee proof/browser-suite.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: webkit-playback-${{ matrix.delivery }}
          path: |
            proof/
            test-results/
            playwright-report/
          retention-days: 14
