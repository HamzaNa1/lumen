name: Client E2E
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      runner:
        required: true
        type: string
      coverage:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  test:
    name: E2E
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - uses: ./.github/actions/bundle-mpv
        if: ${{ runner.os == 'Windows' && inputs.project == 'native' }}
      - name: Run client scenarios
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          COLLECT_COVERAGE: ${{ inputs.coverage }}
        run: |
          command=(bun scripts/test-e2e.ts source --project "$PROJECT" --no-deps)
          if [[ "$COLLECT_COVERAGE" == true ]]; then
            command=(bun scripts/e2e-coverage.ts collect "$PROJECT")
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a bash scripts/with-window-manager.sh "${command[@]}"
          else
            "${command[@]}"
          fi
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.project }}-${{ inputs.runner }}
          coverage-project: ${{ inputs.coverage && inputs.project || '' }}
