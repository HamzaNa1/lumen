name: Client E2E
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      runner:
        required: true
        type: string
      shards:
        description: JSON array of contiguous shard numbers, split by recorded suite durations.
        default: '[1]'
        type: string
permissions:
  contents: read
jobs:
  test:
    name: E2E (${{ matrix.shard }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-runtime
        with:
          # Mixed-client native scenarios launch Chromium alongside Electron.
          browsers: ${{ inputs.project == 'native' && 'chromium' || inputs.project }}
          native: ${{ inputs.project == 'native' }}
      - uses: ./.github/actions/bundle-mpv
        if: ${{ runner.os != 'Linux' && inputs.project == 'native' }}
      - name: Run client scenarios
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          LUMEN_E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          LUMEN_E2E_WORKERS: ${{ runner.os == 'Linux' && inputs.project != 'native' && '3' || '2' }}
        run: |
          command=(bun scripts/test-e2e.ts source --project "$PROJECT" --no-deps)
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a bash scripts/with-window-manager.sh "${command[@]}"
          else
            "${command[@]}"
          fi
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.project }}-${{ inputs.runner }}-${{ matrix.shard }}
