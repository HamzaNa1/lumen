name: test-desktop-windows
on:
  workflow_dispatch:
  push:
    branches: ["fix/windows-fullscreen-overlay-seam", "test/desktop/**"]
permissions:
  contents: read
concurrency:
  group: test-desktop-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/windows-playback
      - name: Package test installers
        shell: pwsh
        run: |
          $baseVersion = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version.Split('-')[0].Split('.')
          $patch = [int]$baseVersion[2] + 1
          $version = "$($baseVersion[0]).$($baseVersion[1]).$patch-fullscreen.${{ github.run_id }}"
          bun run --cwd apps/desktop package --win --x64 "--config.extraMetadata.version=$version"
          if ($LASTEXITCODE -ne 0) { throw "Installer packaging failed" }
          "Version: $version`nCommit: ${{ github.sha }}`nBranch: ${{ github.ref_name }}" | Set-Content apps/desktop/release/build-info.txt
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content apps/desktop/release/SHA256SUMS.txt
          Get-Content apps/desktop/release/build-info.txt >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-test-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/build-info.txt
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
