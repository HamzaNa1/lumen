name: release-preflight
on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.validate.outputs.version }}
      tag:
        value: ${{ jobs.validate.outputs.tag }}
      prerelease:
        value: ${{ jobs.validate.outputs.prerelease }}
      previous-tag:
        value: ${{ jobs.validate.outputs.previous-tag }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      previous-tag: ${{ steps.release.outputs.previous-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate release
        id: release
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bun scripts/release.ts preflight "$RELEASE_PRODUCT" "$RELEASE_VERSION"
