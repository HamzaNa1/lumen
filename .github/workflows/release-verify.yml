name: release-verify
on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
permissions:
  contents: read
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/fetch-release-tags
      - uses: ./.github/actions/setup-dependencies
      - name: Lint
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: bun scripts/check.ts "$RELEASE_PRODUCT" lint
      - name: Build and typecheck
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: |
          bun scripts/check.ts "$RELEASE_PRODUCT" typecheck &
          types_pid=$!
          status=0
          bun scripts/check.ts "$RELEASE_PRODUCT" build || status=$?
          wait "$types_pid" || status=$?
          exit "$status"
  api:
    name: API & tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/fetch-release-tags
      - uses: ./.github/actions/e2e-runtime
      - name: Run API and tooling scenarios
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: bun scripts/test-e2e.ts "$RELEASE_PRODUCT" --project api --project tooling --no-deps
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: release-${{ inputs.product }}-api
  browser:
    name: Browser
    if: ${{ inputs.product == 'server' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: ${{ matrix.project }}
      runner: ubuntu-24.04
      product: ${{ inputs.product }}
  native:
    name: Native
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: ubuntu-24.04
      product: ${{ inputs.product }}
      shards: ${{ inputs.product == 'desktop' && '[1,2,3]' || '[1]' }}
