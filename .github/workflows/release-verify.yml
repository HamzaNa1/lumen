name: release-verify
on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
permissions:
  contents: read
jobs:
  product:
    name: Product check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/e2e-runtime
        with:
          browsers: ${{ inputs.product == 'server' && 'chromium firefox webkit' || 'chromium' }}
          native: 'true'
      - name: Check the selected product
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: xvfb-run -a bash scripts/with-window-manager.sh bun scripts/check.ts "$RELEASE_PRODUCT"
      - name: Check compatibility with the released counterpart
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: xvfb-run -a bash scripts/with-window-manager.sh bun scripts/check-release-compatibility.ts "$RELEASE_PRODUCT"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/e2e-runtime
        with:
          browsers: ${{ inputs.product == 'server' && 'chromium firefox webkit' || 'chromium' }}
          native: 'true'
      - name: Verify the product in browsers
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
          LUMEN_BROWSER_TEST_PORT: '3279'
        run: xvfb-run -a bash scripts/with-window-manager.sh bun scripts/test-browser.ts "$RELEASE_PRODUCT"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-${{ inputs.product }}-browser-test-results
          path: |
            test-results/${{ inputs.product }}/
            playwright-report/${{ inputs.product }}/
          retention-days: 14
          if-no-files-found: error
