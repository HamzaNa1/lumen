name: release
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Bundle MPV (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes 'mpv=0.37.0-1ubuntu4'
          echo 'LUMEN_MPV_VERSION=0.37.0-1ubuntu4' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/bin" "$native_dir/lib"
          cp "$(command -v mpv)" "$native_dir/bin/mpv"
          ldd "$(command -v mpv)" | awk '/=> \// { print $3 }' | while read -r library; do
            case "$(basename "$library")" in
              libc.so.*|libdl.so.*|libm.so.*|libpthread.so.*|librt.so.*) ;;
              *) cp -L "$library" "$native_dir/lib/" ;;
            esac
          done
          install -m 755 /dev/stdin "$native_dir/mpv" <<'EOF'
          #!/bin/sh
          native_dir=$(dirname "$0")
          export LD_LIBRARY_PATH="$native_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$native_dir/bin/mpv" "$@"
          EOF
      - name: Bundle MPV (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv dylibbundler
          test "$(brew list --versions mpv | awk '{ print $2 }')" = '0.41.0'
          echo 'LUMEN_MPV_VERSION=0.41.0' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/lib"
          cp "$(brew --prefix mpv)/lib/libmpv.dylib" "$native_dir/libmpv.dylib"
          dylibbundler -od -b -x "$native_dir/libmpv.dylib" -d "$native_dir/lib" -p '@loader_path/lib/'
      - name: Bundle MPV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpvio.portable --version 0.41.0 --yes --no-progress
          "LUMEN_MPV_VERSION=0.41.0" >> $env:GITHUB_ENV
          $source = Get-ChildItem "$env:ChocolateyInstall\lib\mpvio.portable\tools" -Filter mpv.exe -Recurse | Select-Object -First 1
          if ($null -eq $source) { throw "Chocolatey did not install mpv.exe" }
          $native = "apps/desktop/resources/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "$($source.DirectoryName)\*" $native -Recurse -Force
      - name: Seal and verify native MPV files
        shell: bash
        run: |
          bun scripts/verify-native-binaries.ts --write-manifest
          bun scripts/verify-native-binaries.ts
      - run: bun run --cwd apps/desktop build
      - run: bun run --cwd apps/desktop exec electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.os }}
          path: apps/desktop/release
