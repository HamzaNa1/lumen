name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example, 0.0.1 or 0.0.2-rc.1)'
        required: true
        type: string
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Run releases from the default branch.' >&2
            exit 1
          fi
          bun scripts/version.ts check "$RELEASE_VERSION"
          bun scripts/verify-release-order.ts "$RELEASE_VERSION"
          if gh api "repos/$GH_REPO/releases/tags/v$RELEASE_VERSION" > release.json 2>/dev/null; then
            jq -e --arg sha "$GITHUB_SHA" '.draft == true and .target_commitish == $sha' release.json >/dev/null || {
              echo 'Existing release is published or belongs to another commit.' >&2
              exit 1
            }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo 'Release tag exists without a matching draft.' >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun test
  package:
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Require signing credentials
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
        run: |
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD MAC_SIGN_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              [[ -n "${!name}" ]] || { echo "Missing $name" >&2; exit 1; }
            done
          elif [[ "$RUNNER_OS" == 'Windows' ]]; then
            for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD WIN_PUBLISHER_NAME; do
              [[ -n "${!name}" ]] || { echo "Missing $name" >&2; exit 1; }
            done
          fi
      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CSC_LINK }}
          p12-password: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      - name: Bundle MPV (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes 'mpv=0.37.0-1ubuntu4'
          echo 'LUMEN_MPV_VERSION=0.37.0-1ubuntu4' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/bin" "$native_dir/lib"
          cp "$(command -v mpv)" "$native_dir/bin/mpv"
          ldd "$(command -v mpv)" | awk '/=> \// { print $3 }' | while read -r library; do
            case "$(basename "$library")" in
              libc.so.*|libdl.so.*|libm.so.*|libpthread.so.*|librt.so.*) ;;
              *) cp -L "$library" "$native_dir/lib/" ;;
            esac
          done
          install -m 755 /dev/stdin "$native_dir/mpv" <<'EOF'
          #!/bin/sh
          native_dir=$(dirname "$0")
          export LD_LIBRARY_PATH="$native_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$native_dir/bin/mpv" "$@"
          EOF
      - name: Bundle MPV (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$(uname -m)" != 'arm64' ]]; then
            echo 'macOS releases require an Apple Silicon runner.' >&2
            exit 1
          fi
          brew install mpv dylibbundler
          mpv_version="$(brew list --versions mpv | awk '{ print $2 }')"
          test "${mpv_version%%_*}" = '0.41.0'
          echo 'LUMEN_MPV_VERSION=0.41.0' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/lib"
          cp "$(brew --prefix mpv)/lib/libmpv.dylib" "$native_dir/libmpv.dylib"
          dylibbundler -od -b -x "$native_dir/libmpv.dylib" -d "$native_dir/lib" -p '@loader_path/lib/'
      - name: Bundle MPV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpvio.portable --version 0.41.0 --yes --no-progress
          "LUMEN_MPV_VERSION=0.41.0" >> $env:GITHUB_ENV
          $source = Get-ChildItem "$env:ChocolateyInstall\lib\mpvio.portable\tools" -Filter mpv.exe -Recurse | Select-Object -First 1
          if ($null -eq $source) { throw "Chocolatey did not install mpv.exe" }
          $native = "apps/desktop/resources/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "$($source.DirectoryName)\*" $native -Recurse -Force
      - name: Seal and verify native MPV files
        shell: bash
        run: |
          bun scripts/verify-native-binaries.ts --write-manifest
          bun scripts/verify-native-binaries.ts
      - run: bun run --cwd apps/desktop build
      - name: Package signed desktop
        run: bun run --cwd apps/desktop package
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          LUMEN_MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTRON_BUILDER_7Z_FILTER: ${{ runner.os == 'Windows' && 'BCJ' || '' }}
      - name: Verify packaged app and generated feed
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
        run: |
          channel=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            channel="${RELEASE_VERSION#*-}"
            channel="${channel%%.*}"
          fi
          case "$RUNNER_OS" in
            macOS)
              app_dir=apps/desktop/release/mac-arm64
              native_dir="$app_dir/Lumen.app/Contents/Resources/resources/native"
              feed="$channel-mac.yml"
              codesign --verify --deep --strict --verbose=2 "$app_dir/Lumen.app"
              xcrun stapler validate "$app_dir/Lumen.app"
              find "$native_dir" -name '*.dylib' -exec codesign --verify --strict '{}' ';'
              find "$app_dir/Lumen.app/Contents/Resources/app.asar.unpacked" -name '*.node' -exec codesign --verify --strict '{}' ';'
              zip_file="$(find apps/desktop/release -maxdepth 1 -name '*.zip' -type f -print -quit)"
              test -n "$zip_file"
              mkdir -p "$RUNNER_TEMP/lumen-zip"
              unzip -q "$zip_file" -d "$RUNNER_TEMP/lumen-zip"
              codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/lumen-zip/Lumen.app"
              xcrun stapler validate "$RUNNER_TEMP/lumen-zip/Lumen.app"
              bun scripts/verify-native-binaries.ts --native-dir "$RUNNER_TEMP/lumen-zip/Lumen.app/Contents/Resources/resources/native"
              dmg_file="$(find apps/desktop/release -maxdepth 1 -name '*.dmg' -type f -print -quit)"
              test -n "$dmg_file"
              mkdir -p "$RUNNER_TEMP/lumen-dmg"
              hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/lumen-dmg" "$dmg_file"
              codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/lumen-dmg/Lumen.app"
              bun scripts/verify-native-binaries.ts --native-dir "$RUNNER_TEMP/lumen-dmg/Lumen.app/Contents/Resources/resources/native"
              hdiutil detach "$RUNNER_TEMP/lumen-dmg"
              ;;
            Windows)
              app_dir=apps/desktop/release/win-unpacked
              native_dir="$app_dir/resources/native"
              feed="$channel.yml"
              powershell -NoProfile -Command '$s = Get-AuthenticodeSignature "apps/desktop/release/win-unpacked/Lumen.exe"; if ($s.Status -ne "Valid" -or $s.SignerCertificate.Subject -notlike "*$env:WIN_PUBLISHER_NAME*") { throw "Windows app signer mismatch" }; $m = Get-AuthenticodeSignature "apps/desktop/release/win-unpacked/resources/native/mpv.exe"; if ($m.Status -ne "Valid" -or $m.SignerCertificate.Subject -notlike "*$env:WIN_PUBLISHER_NAME*") { throw "Windows MPV signer mismatch" }; $i = Get-ChildItem apps/desktop/release/Lumen-Setup-*.exe | Select-Object -First 1; if ((Get-AuthenticodeSignature $i.FullName).Status -ne "Valid") { throw "NSIS installer signature invalid" }'
              powershell -NoProfile -File scripts/verify-nsis-payload.ps1
              ;;
            Linux)
              app_dir=apps/desktop/release/linux-unpacked
              native_dir="$app_dir/resources/native"
              feed="$channel-linux.yml"
              ;;
          esac
          test -f "apps/desktop/release/$feed"
          bun scripts/verify-packaged-updater.ts --app-dir "$app_dir"
          bun scripts/verify-native-binaries.ts --native-dir "$native_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ needs.preflight.outputs.version }}-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/alpha*.yml
            apps/desktop/release/beta*.yml
            apps/desktop/release/rc*.yml
          if-no-files-found: error
  server-image:
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.preflight.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ !contains(needs.preflight.outputs.version, '-') && format('{0}:latest', steps.image.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
  publish:
    needs: [preflight, package, server-image]
    runs-on: ubuntu-24.04
    concurrency:
      group: lumen-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: lumen-${{ needs.preflight.outputs.version }}-*
          path: release-assets
      - name: Validate and publish versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          bun scripts/verify-update-artifacts.ts release-assets --version "$RELEASE_VERSION"
          bun scripts/verify-release-order.ts "$RELEASE_VERSION"
          mapfile -t assets < release-assets/files.txt
          if gh api "repos/$GH_REPO/releases/tags/v$RELEASE_VERSION" > release.json 2>/dev/null; then
            jq -e --arg sha "$GITHUB_SHA" '.draft == true and .target_commitish == $sha' release.json >/dev/null || {
              echo 'Existing release is published or belongs to another commit.' >&2
              exit 1
            }
            gh release upload "v$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$RELEASE_VERSION" "${assets[@]}" \
              --draft --target "$GITHUB_SHA" \
              --title "Lumen v$RELEASE_VERSION" --generate-notes
          fi
          bun scripts/verify-update-artifacts.ts release-assets --version "$RELEASE_VERSION" --release "v$RELEASE_VERSION"
          bun scripts/verify-release-order.ts "$RELEASE_VERSION"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "v$RELEASE_VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "v$RELEASE_VERSION" --draft=false --latest
          fi
