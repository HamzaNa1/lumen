name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example, 0.0.1 or 0.0.2-rc.1)'
        required: true
        type: string
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Run releases from the default branch.' >&2
            exit 1
          fi
          bun scripts/version.ts check "$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "v$RELEASE_VERSION already exists." >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
  package:
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Bundle MPV (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes 'mpv=0.37.0-1ubuntu4'
          echo 'LUMEN_MPV_VERSION=0.37.0-1ubuntu4' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/bin" "$native_dir/lib"
          cp "$(command -v mpv)" "$native_dir/bin/mpv"
          ldd "$(command -v mpv)" | awk '/=> \// { print $3 }' | while read -r library; do
            case "$(basename "$library")" in
              libc.so.*|libdl.so.*|libm.so.*|libpthread.so.*|librt.so.*) ;;
              *) cp -L "$library" "$native_dir/lib/" ;;
            esac
          done
          install -m 755 /dev/stdin "$native_dir/mpv" <<'EOF'
          #!/bin/sh
          native_dir=$(dirname "$0")
          export LD_LIBRARY_PATH="$native_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$native_dir/bin/mpv" "$@"
          EOF
      - name: Bundle MPV (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install mpv dylibbundler
          test "$(brew list --versions mpv | awk '{ print $2 }')" = '0.41.0'
          echo 'LUMEN_MPV_VERSION=0.41.0' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/lib"
          cp "$(brew --prefix mpv)/lib/libmpv.dylib" "$native_dir/libmpv.dylib"
          dylibbundler -od -b -x "$native_dir/libmpv.dylib" -d "$native_dir/lib" -p '@loader_path/lib/'
      - name: Bundle MPV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpvio.portable --version 0.41.0 --yes --no-progress
          "LUMEN_MPV_VERSION=0.41.0" >> $env:GITHUB_ENV
          $source = Get-ChildItem "$env:ChocolateyInstall\lib\mpvio.portable\tools" -Filter mpv.exe -Recurse | Select-Object -First 1
          if ($null -eq $source) { throw "Chocolatey did not install mpv.exe" }
          $native = "apps/desktop/resources/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "$($source.DirectoryName)\*" $native -Recurse -Force
      - name: Seal and verify native MPV files
        shell: bash
        run: |
          bun scripts/verify-native-binaries.ts --write-manifest
          bun scripts/verify-native-binaries.ts
      - run: bun run --cwd apps/desktop build
      - run: bun run --cwd apps/desktop exec electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ needs.preflight.outputs.version }}-${{ matrix.os }}
          path: apps/desktop/release
          if-no-files-found: error
  server-image:
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.preflight.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
  publish:
    needs: [preflight, package, server-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lumen-${{ needs.preflight.outputs.version }}-*
          path: release-assets
      - name: Create versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo "Expected six desktop installers, found ${#assets[@]}." >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "v$RELEASE_VERSION" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Lumen v$RELEASE_VERSION" \
            --generate-notes \
            "${flags[@]}"
