name: release
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/desktop build
      - run: bun run --cwd apps/desktop exec electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.os }}
          path: apps/desktop/release
