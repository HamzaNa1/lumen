name: release-server
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Server version (for example, 0.0.8 or 0.0.9-rc.1)'
        required: true
        type: string
concurrency:
  group: release-server
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      product: server
      version: ${{ inputs.version }}
  verify:
    needs: preflight
    uses: ./.github/workflows/release-verify.yml
    with:
      product: server
  server-image:
    name: Server image / ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-server-image
        id: build
        with:
          arch: ${{ matrix.arch }}
          push-image: ${{ steps.image.outputs.name }}
          version: ${{ needs.preflight.outputs.version }}
      - name: Record digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-package-${{ matrix.arch }}
          path: ${{ steps.build.outputs.linux-package }}
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  server-manifest:
    name: Server image manifest
    needs: [preflight, verify, server-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: server-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Tag the multi-arch image
        id: manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          digests=(*)
          [[ "${#digests[@]}" == 2 ]] || { echo 'Expected two native image digests' >&2; exit 1; }
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo 'Invalid image digest' >&2; exit 1; }
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid manifest digest' >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  publish:
    needs: [preflight, server-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-linux-package-*
          path: ${{ runner.temp }}/linux-packages
          merge-multiple: true
      - name: Publish server release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous-tag }}
          SERVER_IMAGE: ${{ needs.server-manifest.outputs.name }}
          SERVER_DIGEST: ${{ needs.server-manifest.outputs.digest }}
        run: |
          bun scripts/release.ts preflight server "$RELEASE_VERSION"
          bun scripts/release.ts notes server "$RELEASE_VERSION" "$PREVIOUS_TAG" > release-notes.md
          packages="$RUNNER_TEMP/linux-packages"
          (cd "$packages" && sha256sum "lumen-server-$RELEASE_VERSION-linux-amd64.tar.gz" "lumen-server-$RELEASE_VERSION-linux-arm64.tar.gz" > SHA256SUMS)
          flags=(--latest=false)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Lumen Server v$RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            "$packages"/lumen-server-*.tar.gz "$packages/SHA256SUMS"
  promote:
    if: needs.preflight.outputs.prerelease == 'false'
    needs: [preflight, server-manifest, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Promote stable image without moving latest backward
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SERVER_IMAGE: ${{ needs.server-manifest.outputs.name }}
          SERVER_DIGEST: ${{ needs.server-manifest.outputs.digest }}
        run: |
          bun scripts/release.ts promotion-check server "$RELEASE_VERSION"
          docker buildx imagetools create --tag "$SERVER_IMAGE:latest" "$SERVER_IMAGE@$SERVER_DIGEST"
      - name: Point the Linux installer at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release view server-latest > /dev/null 2>&1 ||
            gh release create server-latest --target "$GITHUB_SHA" --latest=false \
              --title "Lumen Server installer" \
              --notes "Installs the latest stable Lumen server as a Linux service: \`curl -fsSL https://github.com/$GH_REPO/releases/download/server-latest/install.sh | sudo sh\`"
          printf '%s\n' "$RELEASE_VERSION" > "$RUNNER_TEMP/latest-version"
          # The script first, so the version it is pointed at always has an installer that knows it.
          gh release upload server-latest apps/server/linux/install.sh --clobber
          gh release upload server-latest "$RUNNER_TEMP/latest-version" --clobber
