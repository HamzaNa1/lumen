name: Release compatibility
on:
  workflow_call:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.product }} candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        product: [server, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - name: Mixed browser and desktop compatibility
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          mkdir -p compatibility-results
          xvfb-run -a bash scripts/with-window-manager.sh bun scripts/check-release-compatibility.ts "$PRODUCT" 2>&1 | tee "compatibility-results/$PRODUCT.log"
      - name: Preserve mixed-client evidence before the next suite
        uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.product }}-mixed-compatibility
      - name: Product client scenarios against the released counterpart
        if: ${{ !cancelled() }}
        env:
          PRODUCT: ${{ matrix.product }}
        run: xvfb-run -a bash scripts/with-window-manager.sh bun scripts/test-browser.ts "$PRODUCT"
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.product }}-release-compatibility
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: compatibility-logs-${{ matrix.product }}
          path: compatibility-results/
          retention-days: 14
          if-no-files-found: error
