name: Packaging
on:
  workflow_call:
    inputs:
      product:
        type: string
        default: all
      artifact-prefix:
        type: string
        default: pr-package
      release-certificate:
        description: Sign the macOS app with the release certificate instead of ad hoc.
        type: boolean
        default: false
    secrets:
      MACOS_SIGNING_CERTIFICATE:
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [all, server, desktop]
        default: all
      artifact-prefix:
        type: string
        default: manual-package
      release-certificate:
        description: Sign the macOS app with the release certificate instead of ad hoc.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  server:
    name: Server image / ${{ matrix.arch }}
    if: ${{ inputs.product == 'all' || inputs.product == 'server' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-server-image
        with:
          arch: ${{ matrix.arch }}
  desktop:
    name: Desktop / ${{ matrix.runner }}
    if: ${{ inputs.product == 'all' || inputs.product == 'desktop' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fetch-release-tags
      - uses: ./.github/actions/setup-dependencies
        with:
          electron: 'true'
      - uses: ./.github/actions/setup-apt-mirrors
        if: runner.os == 'Linux'
      - run: bun run check:desktop typecheck
      - uses: ./.github/actions/bundle-mpv
      - run: bun run --cwd apps/desktop build
      - name: Load the macOS release certificate
        if: runner.os == 'macOS' && inputs.release-certificate
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/lumen-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="$RUNNER_TEMP/lumen-signing.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign ignores --keychain unless the keychain is also on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          rm "$certificate"
          echo "LUMEN_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: bun run --cwd apps/desktop package
        env:
          # electron-builder skips signing for pull requests; they never load the certificate, so
          # sign them ad hoc like any other build without it.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: bun apps/desktop/scripts/verify-macos-signature.ts ${{ inputs.release-certificate && '--release' || '' }}
      - name: Verify the update feed (Windows)
        if: runner.os == 'Windows'
        run: bun apps/desktop/scripts/verify-update-feed.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.runner }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14
