name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Server / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - run: bun scripts/e2e-coverage.ts collect api
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: server-linux
          coverage-project: api
  chromium:
    name: Chromium / Linux
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: chromium
      runner: ubuntu-24.04
      coverage: true
  firefox:
    name: Firefox / Linux
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: firefox
      runner: ubuntu-24.04
      coverage: true
  webkit:
    name: WebKit / Linux
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: webkit
      runner: ubuntu-24.04
      coverage: true
  desktop-macos:
    name: Desktop / macOS
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: macos-26
  desktop-windows:
    name: Desktop / Windows
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: windows-latest
  desktop-linux:
    name: Desktop / Linux
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: ubuntu-24.04
      coverage: true
  release-compatibility:
    name: Release compatibility
    uses: ./.github/workflows/release-compatibility.yml
  packaging:
    name: Packaging
    uses: ./.github/workflows/packaging.yml
  quality:
    # Preserve a stable required check; a skipped or failed dependency must fail this gate.
    name: check
    if: ${{ !cancelled() }}
    needs: [server, chromium, firefox, webkit, desktop-macos, desktop-windows, desktop-linux, release-compatibility, packaging]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Tooling E2E
        run: bun scripts/test-e2e.ts source --project tooling --no-deps --no-build
      - name: Download Linux coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/shards
          merge-multiple: true
      - name: Enforce complete-suite coverage budgets
        run: bun scripts/e2e-coverage.ts merge
      - name: Require all nine verification jobs
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: bun -e 'for (const [job, result] of Object.entries(JSON.parse(process.env.RESULTS))) if (result.result !== "success") throw new Error(`${job} ${result.result}`)'
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: quality
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: production-coverage
          path: |
            coverage/summary.json
            coverage/lcov.info
            coverage/shards/
          retention-days: 14
          if-no-files-found: error
