name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Affected jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
      products: ${{ steps.changes.outputs.products }}
      server: ${{ steps.changes.outputs.server }}
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commit ancestry for a reliable merge-base, but only materialize
          # the manifests and classifier. Missing diffs default to all checks.
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /apps/*/package.json
            /packages/*/package.json
            /scripts/ci-changes.ts
            /scripts/lib/ci-changes.ts
            /scripts/lib/products.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci-changes.ts
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dependencies
      - run: bun run lint
      - name: Build and typecheck
        run: |
          bun run typecheck &
          types_pid=$!
          status=0
          bun run build || status=$?
          wait "$types_pid" || status=$?
          exit "$status"
      - name: Tooling E2E
        run: bun scripts/test-e2e.ts source --project tooling --no-deps --no-build
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: quality
  server:
    name: Server / Linux
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-runtime
      - run: bun scripts/test-e2e.ts source --project api --no-deps
        env:
          LUMEN_E2E_CHANGED_PRODUCTS: ${{ needs.changes.outputs.products }}
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: server-linux
  chromium:
    name: Chromium / Linux
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: chromium
      runner: ubuntu-24.04
  firefox:
    name: Firefox / Linux
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: firefox
      runner: ubuntu-24.04
  webkit:
    name: WebKit / Linux
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: webkit
      runner: ubuntu-24.04
  desktop-macos:
    name: Desktop / macOS
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: macos-26
      shards: '[1,2,3]'
  desktop-windows:
    name: Desktop / Windows
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: windows-latest
      shards: '[1,2,3]'
  desktop-linux:
    name: Desktop / Linux
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: ubuntu-24.04
      shards: '[1,2,3]'
  release-compatibility:
    name: Release compatibility
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/release-compatibility.yml
    with:
      product: ${{ needs.changes.outputs.server == 'true' && needs.changes.outputs.desktop == 'true' && 'all' || needs.changes.outputs.server == 'true' && 'server' || 'desktop' }}
  packaging-server:
    name: Server packaging
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/packaging.yml
    with:
      product: server
  packaging-desktop:
    name: Desktop packaging
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/packaging.yml
    with:
      product: desktop
  check:
    # Keep the branch-protection status stable. No checkout or runtime install.
    name: check
    if: ${{ always() }}
    needs: [changes, quality, server, chromium, firefox, webkit, desktop-macos, desktop-windows, desktop-linux, release-compatibility, packaging-server, packaging-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $jobs | .changes.outputs as $flags |
            {changes: "true", quality: "true",
             server: $flags.tests, chromium: $flags.server,
             firefox: $flags.server, webkit: $flags.server,
             "desktop-linux": $flags.tests,
             "desktop-macos": $flags.desktop, "desktop-windows": $flags.desktop,
             "packaging-desktop": $flags.desktop, "packaging-server": $flags.server,
             "release-compatibility": (if $flags.server == "true" or $flags.desktop == "true" then "true" else "false" end)} |
            to_entries | all(.[];
              (.value == "true" or .value == "false") and
              ($jobs[.key].result == "success" or
               (.value == "false" and $jobs[.key].result == "skipped")))
          ' <<< "$RESULTS"
