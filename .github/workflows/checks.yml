name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native-desktop:
    uses: ./.github/workflows/native-desktop.yml
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - run: xvfb-run -a bash scripts/with-window-manager.sh bun run check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: production-coverage
          path: |
            coverage/
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: error
  product-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [server, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/e2e-runtime
      - name: Verify compatibility with the released counterpart
        id: compatibility
        env:
          RELEASE_PRODUCT: ${{ matrix.product }}
        run: |
          set -o pipefail
          mkdir -p compatibility-results
          xvfb-run -a bash scripts/with-window-manager.sh bun scripts/check-release-compatibility.ts "$RELEASE_PRODUCT" 2>&1 | tee "compatibility-results/$RELEASE_PRODUCT.log"
      - name: Upload compatibility diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.compatibility.outcome == 'success' || steps.compatibility.outcome == 'failure') }}
        with:
          name: ${{ matrix.product }}-compatibility-results
          path: compatibility-results/${{ matrix.product }}.log
          retention-days: 14
          if-no-files-found: error
      - name: Verify product browsers
        id: product_browsers
        env:
          RELEASE_PRODUCT: ${{ matrix.product }}
          LUMEN_BROWSER_TEST_PORT: '3279'
        run: xvfb-run -a bash scripts/with-window-manager.sh bun scripts/test-browser.ts "$RELEASE_PRODUCT"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.product_browsers.outcome == 'success' || steps.product_browsers.outcome == 'failure') }}
        with:
          name: ${{ matrix.product }}-browser-test-results
          path: |
            test-results/${{ matrix.product }}/
            playwright-report/${{ matrix.product }}/
          retention-days: 14
          if-no-files-found: error
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: docker build --file apps/server/Dockerfile --tag lumen-server:check .
      - run: bun scripts/smoke-server-image.ts lumen-server:check
