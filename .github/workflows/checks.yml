name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Affected jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.changes.outputs.coverage }}
      desktop: ${{ steps.changes.outputs.desktop }}
      server: ${{ steps.changes.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch commit ancestry for a reliable merge-base, but only materialize
          # the manifests and classifier. Missing diffs default to all checks.
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /apps/*/package.json
            /packages/*/package.json
            /scripts/ci-changes.ts
            /scripts/lib/ci-changes.ts
            /scripts/lib/products.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/ci-changes.ts
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dependencies
      - run: bun run lint
      - name: Build and typecheck
        run: |
          bun run typecheck &
          types_pid=$!
          status=0
          bun run build || status=$?
          wait "$types_pid" || status=$?
          exit "$status"
      - name: Tooling E2E
        run: bun scripts/test-e2e.ts source --project tooling --no-deps --no-build
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: quality
  server:
    name: Server / Linux
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-runtime
      - run: bun scripts/e2e-coverage.ts collect api
      - uses: ./.github/actions/e2e-artifacts
        if: ${{ !cancelled() }}
        with:
          name: server-linux
          coverage-project: api
  chromium:
    name: Chromium / Linux
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: chromium
      runner: ubuntu-24.04
      coverage: true
  firefox:
    name: Firefox / Linux
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: firefox
      runner: ubuntu-24.04
      coverage: true
  webkit:
    name: WebKit / Linux
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: webkit
      runner: ubuntu-24.04
      coverage: true
  desktop-macos:
    name: Desktop / macOS
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: macos-26
      shards: '[1,2,3]'
  desktop-windows:
    name: Desktop / Windows
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: windows-latest
      shards: '[1,2,3]'
  desktop-linux:
    name: Desktop / Linux
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    uses: ./.github/workflows/client-e2e.yml
    with:
      project: native
      runner: ubuntu-24.04
      coverage: true
  release-compatibility:
    name: Release compatibility
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/release-compatibility.yml
    with:
      product: ${{ needs.changes.outputs.server == 'true' && needs.changes.outputs.desktop == 'true' && 'all' || needs.changes.outputs.server == 'true' && 'server' || 'desktop' }}
  packaging-server:
    name: Server packaging
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/packaging.yml
    with:
      product: server
  packaging-desktop:
    name: Desktop packaging
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/packaging.yml
    with:
      product: desktop
  coverage:
    name: Coverage budgets
    needs: [changes, server, chromium, firefox, webkit, desktop-linux]
    if: ${{ !cancelled() && needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dependencies
      - name: Download Linux coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/shards
          merge-multiple: true
      - name: Enforce complete-suite coverage budgets
        run: bun scripts/e2e-coverage.ts merge
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: production-coverage
          path: |
            coverage/summary.json
            coverage/lcov.info
            coverage/shards/
          retention-days: 14
          if-no-files-found: error
  check:
    # Keep the branch-protection status stable. No checkout or runtime install.
    name: check
    if: ${{ always() }}
    needs: [changes, quality, server, chromium, firefox, webkit, desktop-macos, desktop-windows, desktop-linux, release-compatibility, packaging-server, packaging-desktop, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $jobs | .changes.outputs as $flags |
            {changes: "true", quality: "true",
             server: $flags.coverage, chromium: $flags.coverage,
             firefox: $flags.coverage, webkit: $flags.coverage,
             "desktop-linux": $flags.coverage, coverage: $flags.coverage,
             "desktop-macos": $flags.desktop, "desktop-windows": $flags.desktop,
             "packaging-desktop": $flags.desktop, "packaging-server": $flags.server,
             "release-compatibility": (if $flags.server == "true" or $flags.desktop == "true" then "true" else "false" end)} |
            to_entries | all(.[];
              (.value == "true" or .value == "false") and
              ($jobs[.key].result == "success" or
               (.value == "false" and $jobs[.key].result == "skipped")))
          ' <<< "$RESULTS"
