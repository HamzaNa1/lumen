name: release-desktop
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version (for example, 0.0.8 or 0.0.9-rc.1)'
        required: true
        type: string
concurrency:
  group: release-desktop
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      product: desktop
      version: ${{ inputs.version }}
  package:
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun scripts/install-product.ts desktop
      - run: bun run check:desktop typecheck
      - name: Bundle MPV (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes 'mpv=0.37.0-1ubuntu4'
          echo 'LUMEN_MPV_VERSION=0.37.0-1ubuntu4' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/bin" "$native_dir/lib"
          cp "$(command -v mpv)" "$native_dir/bin/mpv"
          ldd "$(command -v mpv)" | awk '/=> \// { print $3 }' | while read -r library; do
            case "$(basename "$library")" in
              libc.so.*|libdl.so.*|libm.so.*|libpthread.so.*|librt.so.*) ;;
              *) cp -L "$library" "$native_dir/lib/" ;;
            esac
          done
          install -m 755 /dev/stdin "$native_dir/mpv" <<'EOF'
          #!/bin/sh
          native_dir=$(dirname "$0")
          export LD_LIBRARY_PATH="$native_dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$native_dir/bin/mpv" "$@"
          EOF
      - name: Bundle MPV (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "$(uname -m)" != 'arm64' ]]; then
            echo 'macOS releases require an Apple Silicon runner.' >&2
            exit 1
          fi
          brew install mpv dylibbundler
          mpv_version="$(brew list --versions mpv | awk '{ print $2 }')"
          test "${mpv_version%%_*}" = '0.41.0'
          echo 'LUMEN_MPV_VERSION=0.41.0' >> "$GITHUB_ENV"
          native_dir="apps/desktop/resources/native"
          mkdir -p "$native_dir/lib"
          cp "$(brew --prefix mpv)/lib/libmpv.dylib" "$native_dir/libmpv.dylib"
          dylibbundler -od -b -x "$native_dir/libmpv.dylib" -d "$native_dir/lib" -p '@loader_path/lib/'
      - name: Bundle MPV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpvio.portable --version 0.41.0 --yes --no-progress
          "LUMEN_MPV_VERSION=0.41.0" >> $env:GITHUB_ENV
          $source = Get-ChildItem "$env:ChocolateyInstall\lib\mpvio.portable\tools" -Filter mpv.exe -Recurse | Select-Object -First 1
          if ($null -eq $source) { throw "Chocolatey did not install mpv.exe" }
          $native = "apps/desktop/resources/native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "$($source.DirectoryName)\*" $native -Recurse -Force
      - name: Seal and verify native MPV files
        shell: bash
        run: |
          bun apps/desktop/scripts/verify-native-binaries.ts --write-manifest
          bun apps/desktop/scripts/verify-native-binaries.ts
      - run: bun run --cwd apps/desktop build
      - run: bun run --cwd apps/desktop package
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-desktop-${{ needs.preflight.outputs.version }}-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error
  publish:
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          pattern: lumen-desktop-${{ needs.preflight.outputs.version }}-*
          path: release-assets
      - name: Publish desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous-tag }}
        run: |
          bun scripts/release.ts preflight desktop "$RELEASE_VERSION"
          bun scripts/release.ts notes desktop "$RELEASE_VERSION" "$PREVIOUS_TAG" > release-notes.md
          mapfile -d '' assets < <(find release-assets -mindepth 2 -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo "Expected six desktop installers, found ${#assets[@]}." >&2
            exit 1
          fi
          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Lumen Desktop v$RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"
