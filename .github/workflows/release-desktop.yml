name: release-desktop
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version (for example, 0.0.8 or 0.0.9-rc.1)'
        required: true
        type: string
concurrency:
  group: release-desktop
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    uses: ./.github/workflows/release-preflight.yml
    with:
      product: desktop
      version: ${{ inputs.version }}
  native-desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-latest]
    uses: ./.github/workflows/client-e2e.yml
    with:
      runner: ${{ matrix.runner }}
      project: native
  package:
    needs: [preflight, native-desktop]
    uses: ./.github/workflows/packaging.yml
    with:
      product: desktop
      artifact-prefix: lumen-desktop-${{ needs.preflight.outputs.version }}
  publish:
    needs: [preflight, native-desktop, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          pattern: lumen-desktop-${{ needs.preflight.outputs.version }}-*
          path: release-assets
      - name: Publish desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous-tag }}
        run: |
          bun scripts/release.ts preflight desktop "$RELEASE_VERSION"
          bun scripts/release.ts notes desktop "$RELEASE_VERSION" "$PREVIOUS_TAG" > release-notes.md
          mapfile -d '' assets < <(find release-assets -mindepth 2 -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            echo "Expected six desktop installers, found ${#assets[@]}." >&2
            exit 1
          fi
          # Installed Windows apps read these from the Latest release to update themselves.
          mapfile -d '' update_feed < <(find release-assets -mindepth 2 -maxdepth 2 -type f \( -name 'latest.yml' -o -name '*.exe.blockmap' \) -print0)
          if [[ "${#update_feed[@]}" -ne 2 ]]; then
            echo "Expected the Windows update feed and its block map, found ${#update_feed[@]} files." >&2
            exit 1
          fi
          assets+=("${update_feed[@]}")
          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Lumen Desktop v$RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"
